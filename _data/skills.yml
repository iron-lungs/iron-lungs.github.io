vendors:
  - name: "Fortinet"
    products: ["FortiGate 7.0 → 7.6", "FortiManager", "FortiAnalyzer", "FortiClient EMS", "FortiSwitch", "FortiAP"]
    fr: "Administration avancée et troubleshooting, intégration Security Fabric, migration VPN SSL → IPSec, bases multi-ADOM, déploiement ZTNA, scripts Python de supervision via FortiAPI."
    en: "Advanced administration and troubleshooting, Security Fabric integration, SSL → IPsec VPN migration, multi-ADOM databases, ZTNA rollout, Python monitoring scripts through FortiAPI."
  - name: "Trend Micro"
    products: ["Worry-Free", "Email Security", "Cloud App Security", "Deep Security", "Vision One"]
    fr: "Administration avancée, déploiement et maintien en condition opérationnelle."
    en: "Advanced administration, deployment and ongoing maintenance."
  - name: "Sophos"
    products: ["Central", "Firewall", "Endpoint & Server", "Email"]
    fr: "Administration des comptes, exploitation intermédiaire à avancée."
    en: "Account administration, intermediate to advanced operation."
  - name: "BeyondTrust"
    products: ["PAM", "Vault"]
    fr: "Super-administration : Group et Session Policies, Jump Groups / Items / Policies, coffre de comptes à privilèges, accès prestataires, audit des sessions."
    en: "Super-administration: Group and Session Policies, Jump Groups / Items / Policies, privileged account vault, third-party access, session auditing."
  - name: "Sekoia"
    products: ["SOC"]
    fr: "Exploitation et analyse des incidents SOC en astreinte."
    en: "Operating and analysing SOC incidents during on-call duty."
  - name: "EasyVista-Observe"
    products: ["Observe"]
    fr: "Administration de la plateforme, box de supervision, sondes, notifications dynamiques (mail → Power Automate → Teams)."
    en: "Platform administration, monitoring boxes, probes, dynamic notifications (email → Power Automate → Teams)."
  - name: "Cisco"
    products: ["IOS"]
    fr: "Configuration et exploitation de commutateurs et routeurs."
    en: "Configuring and operating switches and routers."

