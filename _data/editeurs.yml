# ─────────────────────────────────────────────────────────────
#  Éditeurs (page /editeurs/), en français et en anglais.
#  (fichier nommé « editeurs » : Jekyll ignore tout ce qui commence
#  par « vendor », exclu dans _config.yml)
#  L'ordre ici = l'ordre des onglets ; Fortinet en premier.
#
#  slug      → ancre de la sous-section (/editeurs/#fortinet)
#  certs     → certifications de l'éditeur (vide = pratique terrain)
#  products  → produits administrés en production
#  fr / en   → domaine, synthèse et réalisations
#  Les projets liés sont ceux de _data/projects.yml dont la liste
#  « vendors » contient le slug de l'éditeur.
# ─────────────────────────────────────────────────────────────

- slug: "fortinet"
  name: "Fortinet"
  certs:
    - name: "Fortinet Certified Professional (FCP)"
      track: "Network Security"
      date: "2026"
      parts: ["NSE 4 – FortiGate Administrator 7.4", "NSE 5 – FortiManager Administrator 7.6"]
  products: ["FortiGate 7.0 → 7.6", "FortiManager", "FortiAnalyzer", "FortiClient EMS", "FortiSwitch", "FortiAP"]
  fr:
    domain: "Sécurité réseau · Security Fabric"
    summary: "Éditeur principal au quotidien : administration avancée et troubleshooting de parcs FortiGate clients, du pare-feu au poste de travail, avec une gestion centralisée par FortiManager et FortiAnalyzer."
    points:
      - "Administration avancée et troubleshooting FortiGate 7.0 → 7.6 : politiques, routage, VPN, profils de sécurité"
      - "Intégration Security Fabric : FortiGate, FortiSwitch, FortiAP, FortiClient EMS, FortiAnalyzer"
      - "Gestion centralisée FortiManager : bases multi-ADOM et industrialisation des configurations"
      - "Migration des accès distants VPN SSL → IPSec et déploiement ZTNA"
      - "Scripts Python de supervision via FortiAPI"
  en:
    domain: "Network security · Security Fabric"
    summary: "My main vendor day to day: advanced administration and troubleshooting of client FortiGate estates, from the firewall to the endpoint, centrally managed with FortiManager and FortiAnalyzer."
    points:
      - "Advanced FortiGate 7.0 → 7.6 administration and troubleshooting: policies, routing, VPN, security profiles"
      - "Security Fabric integration: FortiGate, FortiSwitch, FortiAP, FortiClient EMS, FortiAnalyzer"
      - "Central management with FortiManager: multi-ADOM databases and configuration industrialisation"
      - "Remote-access migration from SSL VPN to IPsec and ZTNA rollout"
      - "Python monitoring scripts through FortiAPI"

- slug: "cisco"
  name: "Cisco"
  certs:
    - name: "Cisco CyberOps Associate"
      track: "Cisco Networking Academy"
      date: "2022"
      parts: []
  products: ["IOS", "Commutation", "Routage"]
  fr:
    domain: "Réseau · SOC"
    summary: "Socle réseau acquis pendant la formation d'architecte réseaux et cybersécurité (parcours CCNA), complété par la certification CyberOps Associate orientée analyse SOC."
    points:
      - "Configuration et exploitation de commutateurs et routeurs sous Cisco IOS"
      - "VLAN, trunk, routage inter-VLAN, OSPF, EtherChannel, ACL, NAT / PAT, DHCP"
      - "Fondamentaux SOC : analyse d'alertes, d'événements et de captures réseau"
  en:
    domain: "Networking · SOC"
    summary: "Networking foundation built during the network & cybersecurity architect programme (CCNA track), completed by the SOC-oriented CyberOps Associate certification."
    points:
      - "Configuring and operating Cisco IOS switches and routers"
      - "VLAN, trunking, inter-VLAN routing, OSPF, EtherChannel, ACL, NAT / PAT, DHCP"
      - "SOC fundamentals: analysing alerts, events and network captures"

