# ─────────────────────────────────────────────────────────────
#  Projets (page /projets/ et accueil), en français et en anglais.
#  Ajouter un projet = ajouter un bloc ici. Rien d'autre à toucher.
#
#  kind: "pro"    → mission menée en ESN (anonymisée, parcs clients)
#  kind: "perso"  → projet personnel (grande carte)
#  vendors        → slugs de _data/editeurs.yml : le projet apparaît
#                   aussi dans la sous-section de chaque éditeur
#  private: true  → affiche « Dépôt privé » au lieu d'un lien
#  repo / demo    → liens affichés uniquement s'ils sont renseignés
#  cover          → image optionnelle dans assets/img/ (ex. "cognita.png")
# ─────────────────────────────────────────────────────────────

