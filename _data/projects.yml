  stack: ["FortiGate", "FortiClient EMS", "IPSec", "VPN SSL"]
  fr:
    title: "Migration VPN SSL → IPSec"
    tagline: "Bascule des accès distants de parcs FortiGate clients"
    body: "Remplacement des accès nomades en VPN SSL par des tunnels IPSec sur les FortiGate clients, avec un déploiement des profils côté postes via FortiClient EMS."
