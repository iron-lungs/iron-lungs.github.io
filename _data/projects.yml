    tagline: "Moving remote access off SSL VPN across client FortiGate estates"
    body: "Replacing SSL VPN remote access with IPsec tunnels on client FortiGates, with VPN profiles pushed to endpoints through FortiClient EMS."
    highlights:
      - "Designing the IPsec tunnels and related policies"
      - "Pushing VPN profiles to endpoints from FortiClient EMS"
      - "Gradual cut-over and SSL VPN decommissioning"

