# ─────────────────────────────────────────────────────────────
#  Site — https://pages.ironlungs.eu
# ─────────────────────────────────────────────────────────────
title: "Iron-lungs"   # suffixe des titres : « Page | Iron-lungs »
description: "Ingénieur Cybersécurité & Réseaux : projets, certifications éditeurs, compétences et parcours."
url: "https://pages.ironlungs.eu"
baseurl: ""
author: "Iron-lungs"
lang: fr

# ─────────────────────────────────────────────────────────────
#  Identité — c'est ICI que tu personnalises le site
#  (laisse une valeur vide pour masquer l'élément correspondant)
# ─────────────────────────────────────────────────────────────
# Règle : aucune donnée personnelle (ni prénom ni nom, pseudonyme
# « Iron-lungs » uniquement ; employeur = « ESN », établissements
# anonymisés ; pas de téléphone, adresse, ville ni CV téléchargeable).
owner:
  name: "Iron-lungs"      # pseudonyme uniquement
  github: "iron-lungs"
  email: "verbe_meduses2y@icloud.com"   # vide = non publiée ; jamais en clair dans le HTML (voir contact.html)

# ─────────────────────────────────────────────────────────────
#  Aperçu des liens partagés (LinkedIn, Teams, Slack, messageries…)
#  Image 1200 × 630 par langue, lue par jekyll-seo-tag.
# ─────────────────────────────────────────────────────────────
twitter:
  card: summary_large_image

defaults:
  - scope: { path: "" }
    values:
      image: { path: "/assets/img/og-fr.png", width: 1200, height: 630 }
  - scope: { path: "en" }
    values:
      image: { path: "/assets/img/og-en.png", width: 1200, height: 630 }

# ─────────────────────────────────────────────────────────────
#  Build (plugins autorisés par GitHub Pages)
# ─────────────────────────────────────────────────────────────
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - docs
  - README.md
  - TODO.md
  - .jekyll-cache
  - LICENSE
  - Dockerfile
  - docker-compose.yml
